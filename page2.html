<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>One Important Question ❤️</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="page2.css">
</head>

<body>

    <main class="question-page">

        <div class="glow-one"></div>
        <div class="glow-two"></div>

        <section class="question-card">

            <p class="question-label">
                ONE IMPORTANT QUESTION
            </p>

            <div class="question-heart">
                ♥
            </div>

            <h1>
                Will you go on a
                <span>date with me?</span>
            </h1>

            <p class="question-text">
                There is, technically, a correct answer here.
                Just saying. ❤️
            </p>

            <div class="answer-area">

                <button class="yes-btn">
                    YES
                    <span>♥</span>
                </button>

                <button class="no-btn">
                    NO
                </button>

            </div>

            <p class="no-message">
                You can try... 😌
            </p>

            <p class="question-note">
                Choose carefully. This decision may affect
                the quality of your evening. ✨
            </p>

        </section>

        <footer>
            Made with questionable confidence. ❤️
        </footer>

    </main>

    <script src="page2.js"></script>

</body>

</html>
