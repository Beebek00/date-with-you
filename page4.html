<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Choose Our Time ❤️</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="page4.css">
</head>

<body>

    <main class="time-page">

        <div class="background-glow"></div>

        <section class="time-card">

            <!-- PROGRESS -->
            <div class="progress">

                <span class="completed"></span>
                <span class="active"></span>
                <span></span>
                <span></span>

            </div>

            <!-- STEP -->
            <p class="step-label">
                STEP 2 OF 4
            </p>

            <!-- ICON -->
            <div class="main-time-icon">
                ⏰
            </div>

            <!-- HEADING -->
            <h1>
                What time should
                <span>we meet?</span>
            </h1>

            <p class="subtitle">
                Pick whatever feels right.
                I'll work around you. ❤️
            </p>

            <!-- TIME OPTIONS -->
            <div class="time-options">

                <button class="time-option">

                    <span class="time-icon">
                        ☀️
                    </span>

                    <span class="time-info">

                        <strong class="time">
                            10:00 AM
                        </strong>

                        <small>
                            MORNING
                        </small>

                    </span>

                </button>


                <button class="time-option">

                    <span class="time-icon">
                        🌤️
                    </span>

                    <span class="time-info">

                        <strong class="time">
                            2:00 PM
                        </strong>

                        <small>
                            AFTERNOON
                        </small>

                    </span>

                </button>


                <button class="time-option">

                    <span class="time-icon">
                        🌆
                    </span>

                    <span class="time-info">

                        <strong class="time">
                            5:00 PM
                        </strong>

                        <small>
                            EVENING
                        </small>

                    </span>

                </button>


                <button class="time-option">

                    <span class="time-icon">
                        🌙
                    </span>

                    <span class="time-info">

                        <strong class="time">
                            7:00 PM
                        </strong>

                        <small>
                            NIGHT
                        </small>

                    </span>

                </button>

            </div>


            <!-- CUSTOM TIME BUTTON -->
            <button
                type="button"
                class="custom-time-btn"
            >

                <span class="custom-time-icon">
                    🕐
                </span>

                <span class="custom-time-text">

                    <strong>
                        Choose another time
                    </strong>

                    <small>
                        Pick a time that's perfect for us
                    </small>

                </span>

                <span class="custom-time-arrow">
                    ›
                </span>

            </button>


            <!-- CUSTOM TIME PICKER -->
            <div class="custom-time-picker">

                <div class="picker-header">

                    <div>

                        <span>
                            SELECT TIME
                        </span>

                        <strong class="selected-time-display">
                            05:00 PM
                        </strong>

                    </div>

                </div>


                <div class="time-picker-controls">

                    <!-- HOUR -->
                    <div class="picker-column">

                        <button
                            type="button"
                            class="picker-arrow hour-up"
                        >
                            ▲
                        </button>

                        <div class="picker-value hour-value">
                            05
                        </div>

                        <button
                            type="button"
                            class="picker-arrow hour-down"
                        >
                            ▼
                        </button>

                    </div>


                    <div class="picker-separator">
                        :
                    </div>


                    <!-- MINUTE -->
                    <div class="picker-column">

                        <button
                            type="button"
                            class="picker-arrow minute-up"
                        >
                            ▲
                        </button>

                        <div class="picker-value minute-value">
                            00
                        </div>

                        <button
                            type="button"
                            class="picker-arrow minute-down"
                        >
                            ▼
                        </button>

                    </div>


                    <!-- AM / PM -->
                    <div class="picker-column">

                        <button
                            type="button"
                            class="ampm-option am-option"
                        >
                            AM
                        </button>

                        <button
                            type="button"
                            class="ampm-option pm-option selected"
                        >
                            PM
                        </button>

                    </div>

                </div>


                <button
                    type="button"
                    class="confirm-time-btn"
                >
                    USE THIS TIME
                    <span>✓</span>
                </button>

            </div>


            <!-- CONTINUE -->
            <button class="continue-btn">

                CONTINUE

                <span>
                    →
                </span>

            </button>

        </section>


        <!-- BOTTOM NOTE -->
        <p class="bottom-note">
            The best time is the one we spend together. ❤️
        </p>

    </main>
<!-- Romantic Alert -->

<div class="alert-overlay"></div>

<div class="romantic-alert">

    <div class="alert-heart">
        ♥
    </div>

    <h2>
        One little thing... ❤️
    </h2>

    <p>
        We need a time before we can
        continue planning our little adventure.
    </p>

    <button class="alert-close">
        CHOOSE A TIME
    </button>

</div>

    <script src="page4.js"></script>

</body>

</html>
