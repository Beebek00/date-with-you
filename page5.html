<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Choose Our Date ❤️</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="page5.css">
</head>

<body>

    <main class="experience-page">

        <div class="background-glow"></div>

        <section class="experience-card">

            <!-- PROGRESS -->
            <div class="progress">

                <span class="completed"></span>
                <span class="completed"></span>
                <span class="active"></span>
                <span></span>

            </div>


            <!-- STEP -->
            <p class="step-label">
                STEP 3 OF 4
            </p>


            <!-- ICON -->
            <div class="main-experience-icon">
                📍
            </div>


            <!-- HEADING -->
            <h1>
                What kind of date
                <span>do you want?</span>
            </h1>


            <p class="subtitle">
                Choose the vibe.
                I'll figure out the rest. ❤️
            </p>


            <!-- EXPERIENCE OPTIONS -->
            <div class="experience-options">


                <!-- COFFEE -->
                <button
                    type="button"
                    class="experience-option"
                >

                    <div class="experience-icon">
                        ☕
                    </div>

                    <div class="experience-content">

                        <h2>
                            Coffee & Talk
                        </h2>

                        <p>
                            Good coffee, better conversations.
                        </p>

                    </div>

                    <div class="selection-check">
                        ✓
                    </div>

                </button>


                <!-- MOVIE -->
                <button
                    type="button"
                    class="experience-option"
                >

                    <div class="experience-icon">
                        🎬
                    </div>

                    <div class="experience-content">

                        <h2>
                            Movie Date
                        </h2>

                        <p>
                            Snacks, movies and questionable reviews.
                        </p>

                    </div>

                    <div class="selection-check">
                        ✓
                    </div>

                </button>


                <!-- FOOD -->
                <button
                    type="button"
                    class="experience-option"
                >

                    <div class="experience-icon">
                        🍕
                    </div>

                    <div class="experience-content">

                        <h2>
                            Food Adventure
                        </h2>

                        <p>
                            Find something delicious and eat it.
                        </p>

                    </div>

                    <div class="selection-check">
                        ✓
                    </div>

                </button>


                <!-- WALK -->
                <button
                    type="button"
                    class="experience-option"
                >

                    <div class="experience-icon">
                        🌆
                    </div>

                    <div class="experience-content">

                        <h2>
                            Evening Walk
                        </h2>

                        <p>
                            Fresh air, city lights and us.
                        </p>

                    </div>

                    <div class="selection-check">
                        ✓
                    </div>

                </button>


                <!-- SURPRISE -->
                <button
                    type="button"
                    class="experience-option surprise-option"
                >

                    <div class="experience-icon">
                        🎁
                    </div>

                    <div class="experience-content">

                        <h2>
                            Surprise Me
                        </h2>

                        <p>
                            You choose nothing. Trust me. 😌
                        </p>

                    </div>

                    <div class="selection-check">
                        ✓
                    </div>

                </button>

            </div>


            <!-- CONTINUE -->
            <button class="continue-btn">

                CONTINUE

                <span>
                    →
                </span>

            </button>

        </section>


        <!-- BOTTOM NOTE -->
        <p class="bottom-note">
            The best dates are the ones we remember. ❤️
        </p>

    </main>

<div class="alert-overlay"></div>

<div class="romantic-alert">

    <div class="alert-heart">
        ♥
    </div>

    <h2>
        One little thing... ❤️
    </h2>

    <p>
        We need to choose the kind of date
        before we can plan our little adventure.
    </p>

    <button class="alert-close">
        CHOOSE A DATE VIBE
    </button>

</div>
    <script src="page5.js"></script>

</body>

</html>
